# Membuat APK "Matoer POS" otomatis setiap ada perubahan di folder android/.
# Hasil: tab Actions → run terbaru → bagian Artifacts → "MatoerPOS-apk" (berisi file .apk).
name: APK Matoer POS

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Opsional: bila GitHub Secrets kunci tanda tangan sudah diisi (lihat docs/android-pos-panduan.md),
      # APK ditandatangani kunci tetap sehingga versi baru bisa dipasang menimpa versi lama.
      - name: Siapkan kunci tanda tangan (opsional)
        env:
          KEYSTORE_B64: ${{ secrets.MATOER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/matoer-pos.jks"
            echo "MATOER_KEYSTORE_FILE=$RUNNER_TEMP/matoer-pos.jks" >> "$GITHUB_ENV"
          else
            echo "Secrets kunci belum diisi: APK ditandatangani kunci debug (untuk uji coba)."
          fi
      - name: Build APK
        env:
          MATOER_KEYSTORE_PASSWORD: ${{ secrets.MATOER_KEYSTORE_PASSWORD }}
          MATOER_KEY_ALIAS: ${{ secrets.MATOER_KEY_ALIAS }}
          MATOER_KEY_PASSWORD: ${{ secrets.MATOER_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: MatoerPOS-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
